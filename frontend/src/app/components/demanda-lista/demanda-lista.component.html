<!-- O layout já envolve a página num .container com espaçamento -->
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">Demandas</h4>
  <button type="button" class="btn btn-primary" *ngIf="ehAdmin" (click)="novo()">
    <i class="fas fa-plus me-1" aria-hidden="true"></i>Nova demanda
  </button>
</div>

<form class="row g-2 mb-3" (ngSubmit)="buscar()">
  <div class="col-md-4">
    <input type="text" class="form-control" name="titulo" placeholder="Buscar por título"
           [(ngModel)]="filtroTitulo" />
  </div>
  <div class="col-md-3">
    <select class="form-select" name="empresa" [(ngModel)]="filtroEmpresaId" (ngModelChange)="buscar()">
      <option [ngValue]="null">Todas as empresas</option>
      <option *ngFor="let e of empresas" [ngValue]="e.id">{{ e.nome }}</option>
    </select>
  </div>
  <div class="col-md-2">
    <select class="form-select" name="situacao" [(ngModel)]="filtroSituacao" (ngModelChange)="buscar()">
      <option value="">Todas as situações</option>
      <option *ngFor="let s of situacoes" [value]="s.valor">{{ s.rotulo }}</option>
    </select>
  </div>
  <div class="col-md-3 d-flex gap-2">
    <button type="submit" class="btn btn-primary flex-fill">Buscar</button>
    <button type="button" class="btn btn-secondary flex-fill" (click)="limparFiltros()">Limpar</button>
  </div>
</form>

<div class="table-responsive bg-white shadow-sm rounded">
  <table class="table table-hover align-middle mb-0">
    <thead class="table-light">
      <tr>
        <th>Título</th>
        <th>Empresa</th>
        <th>Tecnologias</th>
        <th>Situação</th>
        <th class="text-end" *ngIf="ehAdmin">Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let d of pagina?.content">
        <td>{{ d.titulo }}</td>
        <td>{{ d.empresaNome }}</td>
        <td>{{ d.tecnologias || '—' }}</td>
        <td>
          <span class="badge"
                [class.badge-success]="d.situacao === 'DISPONIVEL'"
                [class.badge-secondary]="d.situacao === 'ENCERRADA'">
            {{ rotuloSituacao(d.situacao) }}
          </span>
        </td>
        <td class="text-end text-nowrap" *ngIf="ehAdmin">
          <!-- RN-03: demanda encerrada não pode ser editada -->
          <button type="button" class="btn btn-sm btn-primary me-2" (click)="editar(d)"
                  [disabled]="d.situacao === 'ENCERRADA'"
                  [title]="d.situacao === 'ENCERRADA' ? 'Demanda encerrada não pode ser editada' : 'Editar'">
            Editar
          </button>
          <button type="button" class="btn btn-sm btn-danger" (click)="excluir(d)">Excluir</button>
        </td>
      </tr>
      <tr *ngIf="!carregando && pagina?.content?.length === 0">
        <td [attr.colspan]="ehAdmin ? 5 : 4" class="text-center text-muted py-4">
          Nenhuma demanda encontrada.
        </td>
      </tr>
      <tr *ngIf="carregando">
        <td [attr.colspan]="ehAdmin ? 5 : 4" class="text-center text-muted py-4">Carregando...</td>
      </tr>
    </tbody>
  </table>
</div>

<nav class="d-flex justify-content-between align-items-center mt-3" *ngIf="pagina && pagina.totalPages > 0">
  <small class="text-muted">
    Página {{ pagina.number + 1 }} de {{ pagina.totalPages }} · {{ pagina.totalElements }} demanda(s)
  </small>
  <ul class="pagination mb-0">
    <li class="page-item" [class.disabled]="pagina.number === 0">
      <button type="button" class="page-link" (click)="irParaPagina(pagina.number - 1)">Anterior</button>
    </li>
    <li class="page-item" [class.disabled]="pagina.number + 1 >= pagina.totalPages">
      <button type="button" class="page-link" (click)="irParaPagina(pagina.number + 1)">Próxima</button>
    </li>
  </ul>
</nav>
